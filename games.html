<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="DuckHTML Unblocked Games, Free to play" />
<title>Games | DuckHTML</title>
<link rel="icon" href="https://ucarecdn.com/cf91fdbc-e959-4737-9276-c5ddb93799a8/duckhtml.png" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
</head>
<body>
  <nav>
      <div class="logo">
          <img src="https://ucarecdn.com/cf91fdbc-e959-4737-9276-c5ddb93799a8/duckhtml.png" alt="DuckHTML Logo" />
          <span>DuckHTML</span>
      </div>
      <div>
          <a href="/index.html">Home</a>
          <a href="/games.html">Games</a>
          <a href="/settings.html">Settings</a>
          <a href="/search.html">Search</a>
      </div>
  </nav><main>
    <header id="gamesHeader">
      <h1>Games</h1>
      <p>Discover and play free games across different categories. Use the search and filter tools to find your favorites or try a random game!</p>
    </header>

    <div id="searchFilterContainer">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by title or tags..."
        oninput="filterGames()"
        aria-label="Search games"
      />
      <select id="filterSelect" onchange="filterGames()" aria-label="Filter games by category">
        <option value="all">All Categories</option>
        <option value="action">Action</option>
        <option value="arcade">Arcade</option>
        <option value="puzzle">Puzzle</option>
        <option value="sports">Sports</option>
        <option value="racing">Racing</option>
        <option value="platformer">Platformer</option>
        <option value="shooter">Shooter</option>
        <option value="classic">Classic</option>
        <option value="logic">Logic</option>
        <!-- Add more categories as needed -->
      </select>
      <button id="randomGameBtn" aria-label="Play a random game">🎲</button>
    </div>
    <div id="gameContainer">
      <!-- Games loaded here -->
    </div>
  </main>

    <div id="gameContainer">
      <!-- Games loaded here -->
    </div>
  </main>

</body>
</html>
