<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="DuckHTML Unblocked Games, Free to play" />
  <title>Search | DuckHTML</title>
  <link rel="icon" href="https://ucarecdn.com/cf91fdbc-e959-4737-9276-c5ddb93799a8/duckhtml.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
</head>
<body>
  <nav>
      <div class="logo">
          <img src="https://ucarecdn.com/cf91fdbc-e959-4737-9276-c5ddb93799a8/duckhtml.png" alt="DuckHTML Logo" />
          <span>DuckHTML</span>
      </div>
      <div>
          <a href="/index.html">Home</a>
          <a href="/games.html">Games</a>
          <a href="/settings.html">Settings</a>
      </div>
  </nav>

  <main>
    <header id="gamesHeader">
      <h1>Search Games</h1>
      <p>Find your favorite games using our advanced search and filtering options.</p>
    </header>

    <div id="searchFilterContainer">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by title or tags..."
        oninput="filterGames()"
        aria-label="Search games"
      />
      <select id="filterSelect" onchange="filterGames()" aria-label="Filter games by category">
        <option value="all">All Categories</option>
        <option value="action">Action</option>
        <option value="arcade">Arcade</option>
        <option value="puzzle">Puzzle</option>
        <option value="sports">Sports</option>
        <option value="racing">Racing</option>
        <option value="platformer">Platformer</option>
        <option value="shooter">Shooter</option>
        <option value="classic">Classic</option>
        <option value="logic">Logic</option>
      </select>
      <button id="randomGameBtn" aria-label="Play a random game">🎲</button>
    </div>

    <div id="gameContainer">
      <!-- Games loaded here -->
    </div>
  </main>

<footer>
  &copy; 2025 DuckH2TML. All rights reserved. | <a href="/privacy.html" style="color:#f39c12;">Privacy Policy</a>
</footer>

<script src="script.js"></script>
<script src="settings.js"></script>

</body>
</html>

<style>


/* Settings Page Styling */
.settings-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}

.settings-header {
  text-align: center;
  margin-bottom: 40px;
}

.settings-header h1 {
  font-family: 'Press Start 2P', cursive;
  font-size: 2.5rem;
  color: #ffd700;
  margin: 0 0 15px 0;
  text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
}

.settings-header p {
  font-family: 'VT323', monospace;
  font-size: 1.3rem;
  color: #ccc;
  margin: 0;
}

/* Settings Grid Layout */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
  margin-bottom: 40px;
}

/* Settings Card */
.settings-card {
  background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
  border: 2px solid #444;
  border-radius: 15px;
  padding: 25px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.settings-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 35px rgba(255, 215, 0, 0.2);
  border-color: #ffd700;
}

.card-header {
  margin-bottom: 25px;
  border-bottom: 2px solid #444;
  padding-bottom: 15px;
}

.card-header h2 {
  font-family: 'Press Start 2P', cursive;
  font-size: 1.2rem;
  color: #ffd700;
  margin: 0 0 8px 0;
}

.card-header p {
  font-family: 'VT323', monospace;
  font-size: 1rem;
  color: #aaa;
  margin: 0;
}

/* Setting Groups */
.setting-group {
  margin-bottom: 20px;
}

.setting-group label {
  display: block;
  font-family: 'VT323', monospace;
  font-size: 1.1rem;
  color: #ffd700;
  margin-bottom: 8px;
  font-weight: bold;
}

.setting-group input,
.setting-group select {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid #555;
  border-radius: 10px;
  background: #333;
  color: #eee;
  font-family: 'VT323', monospace;
  font-size: 1rem;
  box-sizing: border-box;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.setting-group input:focus,
.setting-group select:focus {
  outline: none;
  border-color: #ffd700;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
}

.setting-group small {
  display: block;
  font-family: 'VT323', monospace;
  font-size: 0.9rem;
  color: #888;
  margin-top: 5px;
  font-style: italic;
}

/* Favicon Grid */
.favicon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 15px;
  margin-top: 15px;
}

.favicon-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px 10px;
  background: #333;
  border: 2px solid #555;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: center;
}

.favicon-option:hover {
  border-color: #ffd700;
  background: #444;
  transform: scale(1.05);
}

.favicon-option img {
  width: 32px;
  height: 32px;
  margin-bottom: 8px;
  border-radius: 4px;
}

.favicon-option span {
  font-family: 'VT323', monospace;
  font-size: 0.9rem;
  color: #ccc;
}

/* Warning Box */
.warning-box {
  background: linear-gradient(135deg, #3a2a00 0%, #4a3500 100%);
  border: 2px solid #ffa500;
  border-radius: 8px;
  padding: 15px;
  margin-top: 15px;
  font-family: 'VT323', monospace;
  color: #ffd700;
  font-size: 0.95rem;
}

/* Action Section */
.action-section {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 30px;
}

.action-button {
  font-family: 'Press Start 2P', cursive;
  font-size: 0.9rem;
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.action-button.primary {
  background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
  color: #121212;
}

.action-button.primary:hover {
  background: linear-gradient(135deg, #ffed4e 0%, #fff700 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
}

.action-button.secondary {
  background: linear-gradient(135deg, #555 0%, #666 100%);
  color: #eee;
}

.action-button.secondary:hover {
  background: linear-gradient(135deg, #666 0%, #777 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
}

/* Status Message */
.status-message {
  text-align: center;
  padding: 15px;
  border-radius: 10px;
  font-family: 'VT323', monospace;
  font-size: 1.1rem;
  margin: 20px 0;
  transition: all 0.3s ease;
}

.status-message.success {
  background: linear-gradient(135deg, #1e4a3a 0%, #2d6e50 100%);
  border: 2px solid #4CAF50;
  color: #90EE90;
}

.status-message.error {
  background: linear-gradient(135deg, #4a1e1e 0%, #6e2d2d 100%);
  border: 2px solid #f44336;
  color: #ffaaaa;
}

.status-message.hidden {
  display: none;
}

/* Responsive Design */
@media (max-width: 1200px) {
  .settings-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 768px) {
  .settings-container {
    padding: 15px;
  }
  
  .settings-header h1 {
    font-size: 2rem;
  }
  
  .settings-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  
  .settings-card {
    padding: 20px;
  }
  
  .action-section {
    flex-direction: column;
    align-items: center;
  }
  
  .action-button {
    width: 100%;
    max-width: 300px;
  }
  
  .favicon-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 480px) {
  .settings-header h1 {
    font-size: 1.5rem;
  }
  
  .card-header h2 {
    font-size: 1rem;
  }
  
  .favicon-grid {
    grid-template-columns: 1fr;
  }
}
</style>



<script>


  // Load saved settings on page load
  document.addEventListener('DOMContentLoaded', function() {
    loadSavedSettings();
    setupPanicKey();
    applyTheme(localStorage.getItem('selectedTheme') || '#121212');
  });

  // Load saved settings from localStorage
  function loadSavedSettings() {
    const savedTitle = localStorage.getItem('pageTitle');
    const savedFavicon = localStorage.getItem('faviconUrl');
    const savedTheme = localStorage.getItem('selectedTheme');
    const savedPanicKey = localStorage.getItem('panicKey');
    const savedPanicUrl = localStorage.getItem('panicUrl');

    // Update title on all pages
    if (savedTitle) {
      document.title = savedTitle;
    }

    // Update favicon on all pages
    if (savedFavicon) {
      updateFavicon(savedFavicon);
    }

    // Only update form elements if they exist (on settings page)
    const pageTitleInput = document.getElementById('pageTitle');
    if (pageTitleInput && savedTitle) {
      pageTitleInput.value = savedTitle;
    }

    const faviconInput = document.getElementById('faviconUrl');
    if (faviconInput && savedFavicon) {
      faviconInput.value = savedFavicon;
    }

    const colorSelect = document.getElementById('colorSelect');
    if (colorSelect && savedTheme) {
      colorSelect.value = savedTheme;
    }

    const panicKeyInput = document.getElementById('panicKey');
    if (panicKeyInput && savedPanicKey) {
      panicKeyInput.value = savedPanicKey;
    }

    const panicUrlInput = document.getElementById('panicUrl');
    if (panicUrlInput && savedPanicUrl) {
      panicUrlInput.value = savedPanicUrl;
    }
  }

  // Apply changes with user feedback
  function applyChanges() {
    try {
      const newTitle = document.getElementById('pageTitle').value || 'DuckHTML';
      const newFavicon = document.getElementById('faviconUrl').value;
      const selectedTheme = document.getElementById('colorSelect').value;
      const panicKey = document.getElementById('panicKey').value.toLowerCase();
      const panicUrl = document.getElementById('panicUrl').value;

      // Save to localStorage
      localStorage.setItem('pageTitle', newTitle);
      localStorage.setItem('faviconUrl', newFavicon);
      localStorage.setItem('selectedTheme', selectedTheme);
      localStorage.setItem('panicKey', panicKey);
      localStorage.setItem('panicUrl', panicUrl);

      // Apply changes immediately
      document.title = newTitle;
      if (newFavicon) {
        updateFavicon(newFavicon);
      }
      applyTheme(selectedTheme);

      // Restart panic key listener
      setupPanicKey();

      // Show success message
      showStatusMessage('✅ Settings saved successfully!', 'success');
    } catch (error) {
      showStatusMessage('❌ Error saving settings. Please try again.', 'error');
      console.error('Error saving settings:', error);
    }
  }

  // Reset settings to default
  function resetSettings() {
    if (confirm('Are you sure you want to reset all settings to default? This cannot be undone.')) {
      localStorage.removeItem('pageTitle');
      localStorage.removeItem('faviconUrl');
      localStorage.removeItem('selectedTheme');
      localStorage.removeItem('panicKey');
      localStorage.removeItem('panicUrl');

      // Reset form fields
      document.getElementById('pageTitle').value = '';
      document.getElementById('faviconUrl').value = '';
      document.getElementById('colorSelect').value = '#121212';
      document.getElementById('panicKey').value = '';
      document.getElementById('panicUrl').value = '';

      // Apply defaults
      document.title = 'Settings | DuckHTML';
      updateFavicon('https://ucarecdn.com/cf91fdbc-e959-4737-9276-c5ddb93799a8/duckhtml.png');
      applyTheme('#121212');

      showStatusMessage('🔄 Settings reset to default values', 'success');
    }
  }

  // Show status message to user
  function showStatusMessage(message, type) {
    const statusEl = document.getElementById('statusMessage');
    if (statusEl) {
      statusEl.textContent = message;
      statusEl.className = `status-message ${type}`;

      // Auto-hide after 3 seconds
      setTimeout(() => {
        statusEl.className = 'status-message hidden';
      }, 3000);
    }
  }

  // Set up panic key functionality
  function setupPanicKey() {
    // Remove existing listeners
    document.removeEventListener('keydown', panicKeyHandler);

    const panicKey = localStorage.getItem('panicKey');
    const panicUrl = localStorage.getItem('panicUrl');

    if (panicKey && panicUrl) {
      document.addEventListener('keydown', panicKeyHandler);
    }
  }

  // Panic key handler
  function panicKeyHandler(event) {
    const panicKey = localStorage.getItem('panicKey');
    const panicUrl = localStorage.getItem('panicUrl');

    if (event.key.toLowerCase() === panicKey && panicUrl) {
      window.location.href = panicUrl;
    }
  }

  // Update favicon
  function updateFavicon(faviconUrl) {
    if (!faviconUrl) return;

    let link = document.querySelector("link[rel~='icon']");
    if (!link) {
      link = document.createElement('link');
      link.rel = 'icon';
      document.head.appendChild(link);
    }
    link.href = faviconUrl;
  }

  // Handle favicon selection from grid
  function selectFavicon(url) {
    document.getElementById('faviconUrl').value = url;
    updateFavicon(url);
    showStatusMessage('🎯 Favicon updated! Don\'t forget to save changes.', 'success');
  }

  // Apply theme based on selected option
  function applyTheme(theme) {
    localStorage.setItem('selectedTheme', theme);

    const themes = {
      '#121212': {
        body: '#121212',
        nav: 'rgba(0, 0, 0, 0.85)',
        text: '#eee',
        border: '#444',
        accent: '#ffd700'
      },
      '#ffffff': {
        body: '#ffffff',
        nav: 'rgba(255, 255, 255, 0.95)',
        text: '#333',
        border: '#ddd',
        accent: '#1976d2'
      },
      '#2c1810': {
        body: '#2c1810',
        nav: 'rgba(44, 24, 16, 0.85)',
        text: '#f4e4bc',
        border: '#8b4513',
        accent: '#daa520'
      },
      '#0f1419': {
        body: '#0f1419',
        nav: 'rgba(15, 20, 25, 0.85)',
        text: '#c9d1d9',
        border: '#30363d',
        accent: '#58a6ff'
      },
      '#1a1a2e': {
        body: '#1a1a2e',
        nav: 'rgba(26, 26, 46, 0.85)',
        text: '#e94560',
        border: '#16213e',
        accent: '#0f3460'
      }
    };

    const selectedTheme = themes[theme] || themes['#121212'];
    setThemeStyles(selectedTheme.body, selectedTheme.nav, selectedTheme.text, selectedTheme.border, selectedTheme.accent);
  }

  // Handle theme change
  function changeBackgroundColor() {
    const selectedTheme = document.getElementById('colorSelect').value;
    applyTheme(selectedTheme);
  }

  // Set theme styles throughout the page
  function setThemeStyles(bodyColor, navColor, textColor, borderColor, accentColor) {
    const body = document.body;
    const nav = document.querySelector('nav');

    // Apply basic theme
    body.style.backgroundColor = bodyColor;
    body.style.color = textColor;

    if (nav) {
      nav.style.backgroundColor = navColor;
    }

    // Update nav links
    const navLinks = document.querySelectorAll('nav a');
    navLinks.forEach(link => {
      link.style.color = textColor;
      link.style.borderColor = borderColor;
    });

    // Update headings
    const headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
    headings.forEach(heading => {
      heading.style.color = accentColor;
    });

    // Update form elements
    const inputs = document.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
      input.style.backgroundColor = bodyColor === '#ffffff' ? '#f8f9fa' : '#333';
      input.style.color = textColor;
      input.style.borderColor = borderColor;
    });
  }

</script>
