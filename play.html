<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="DuckHTML Unblocked Games, Free to play" />
  <title>DuckHTML</title>
  <link rel="icon" type="image/x-icon" href="https://ucarecdn.com/cf91fdbc-e959-4737-9276-c5ddb93799a8/duckhtml.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />

  <!-- Google tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8X677NPBRV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-8X677NPBRV');
  </script>
<script type='text/javascript' src='//pl24530633.profitableratecpm.com/8a/26/04/8a2604b7dc51db332008ddf67973775b.js'></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      overflow: hidden;
    }

    nav {
      width: 100%;
      position: fixed;
      top: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      z-index: 1000;
    }

    nav .logo {
      display: flex;
      align-items: center;
    }

    nav .logo img {
      height: 50px;
      margin-right: 10px;
    }

    nav .logo span {
      font-size: 24px;
      color: white;
      font-weight: bold;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: white;
      font-family: 'Press Start 2P', sans-serif;
      font-weight: bold;
      font-size: 16px;
      transition: color 0.3s ease-in-out, border 0.3s ease-in-out;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 8px 16px;
    }

    nav a:hover {
      color: #ffd700;
      border-color: white;
    }

    h1 {
      font-size: 1.8rem;
      color: #fff;
      position: absolute;
      top: 80px;
      right: 50px;
      font-family: 'Press Start 2P', sans-serif;
    }

    #iframe-container {
      position: absolute;
      top: 95px;
      left: 10px;
      right: 20px;
      bottom: 150px;
      display: flex;
      justify-content: flex-start;
    }

    iframe {
      width: 72vw;
      height: calc(90vh - 100px);
      border: none;
    }

    .button-container {
      position: absolute;
      top: calc(120px + 80px);
      right: 80px;
      display: flex;
      gap: 10px;
    }

    button {
      display: flex;
      align-items: center;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      padding: 20px 30px;
      border: none;
      background-color: #ffd700;
      transition: background-color 0.3s ease-in-out, transform 0.2s ease;
    }

    button img {
      width: 30px;
      height: auto;
    }

    button:active {
      background-color: #ff6347;
      transform: scale(0.95);
    }

    /* Ad popup styles */
    .ad-popup {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #222;
      color: white;
      padding: 20px;
      z-index: 9999;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
      width: 600px;
      max-width: 90%;
    }

    .ad-popup .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #444;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .ad-content {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">
      <img src="https://ucarecdn.com/cf91fdbc-e959-4737-9276-c5ddb93799a8/duckhtml.png" alt="DuckHTML Logo" />
      <span>DuckHTML</span>
    </div>
    <div>
      <a href="/index.html">Home</a>
      <a href="/games.html">Games</a>
      <a href="/settings.html">Settings</a>
      <a href="/search.html">Search</a>
    </div>
  </nav>

  <h1 id="gameTitle">GAMENAMEHERE</h1>
  <div id="iframe-container"></div>

  <div class="button-container">
    <button onclick="toggleFullscreen()">
      <img src="https://cdn0.iconfinder.com/data/icons/audio-and-video-outline-1/24/audio_-31-512.png" alt="Fullscreen Icon" />
    </button>
    <button onclick="refreshIframe()">
      <img src="https://static.thenounproject.com/png/1810370-200.png" alt="Refresh Icon" />
    </button>
    <button onclick="openInBlank()">
      <img src="https://static.thenounproject.com/png/1483687-200.png" alt="Open Blank Icon" />
    </button>
  </div>

</body>
</html>
